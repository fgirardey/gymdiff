[package]
name = "gymdiff-app"
description = "GymDiff desktop app (Slint UI)."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "gymdiff"
path = "src/main.rs"

[dependencies]
gymdiff-core = { workspace = true }
gymdiff-diagnostics = { workspace = true }
gymdiff-lol = { workspace = true }
gymdiff-shortcuts = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `unstable-winit-030`: bring the window to the front when it is shown again (ADR-0013).
slint = { workspace = true, features = ["unstable-winit-030"] }
# Stack traces (backtrace, debug-images, panic), OS and Rust contexts, native
# crashes as minidumps (minidump): see ADR-0006.
sentry = { version = "0.49.5", default-features = false, features = ["reqwest", "native-tls", "tracing", "logs", "backtrace", "debug-images", "contexts", "panic", "minidump"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
# Installer and auto-update (ADR-0011): pinned to the version of the `vpk` tool used in CI.
velopack = "=1.2.161"
# Local time of the last update check, shown in Settings.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Notification area icon (menu bar on macOS), and the crest decoded for it (ADR-0013).
tray-icon = "0.26"
png = { workspace = true }
# One GymDiff at a time: a second one asks the first to show its window (ADR-0013).
interprocess = "2"
# Game history in a local SQLite database, built in so nothing is installed (ADR-0007).
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = { workspace = true }
# Champion names and images from Data Dragon (ADR-0004).
reqwest = { workspace = true }

[dev-dependencies]
# Paused clock, to test the import's retries without waiting.
tokio = { workspace = true, features = ["test-util"] }
# tests/previews.rs compiles every ui/**/*.preview.slint file.
slint-interpreter = { workspace = true }
spin_on = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
# Version resource of gymdiff.exe (only used when building on Windows).
winresource = "0.1"

[lints]
workspace = true
