[package]
name = "gymdiff-app"
description = "GymDiff desktop app (Slint UI)."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "gymdiff"
path = "src/main.rs"

[dependencies]
gymdiff-core = { workspace = true }
gymdiff-diagnostics = { workspace = true }
gymdiff-lol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
sentry = { version = "0.49.5", default-features = false, features = ["reqwest", "native-tls", "tracing", "logs"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# tests/previews.rs compiles every ui/**/*.preview.slint file.
slint-interpreter = { workspace = true }
spin_on = { workspace = true }
# examples/screenshots.rs writes the rendered previews as PNG.
png = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true
