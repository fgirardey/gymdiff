[package]
name = "gymdiff-app"
description = "GymDiff desktop app (Slint UI)."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "gymdiff"
path = "src/main.rs"

[dependencies]
gymdiff-core = { workspace = true }
gymdiff-diagnostics = { workspace = true }
gymdiff-lol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
# Stack traces (backtrace, debug-images, panic), OS and Rust contexts, native
# crashes as minidumps (minidump): see ADR-0006.
sentry = { version = "0.49.5", default-features = false, features = ["reqwest", "native-tls", "tracing", "logs", "backtrace", "debug-images", "contexts", "panic", "minidump"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# tests/previews.rs compiles every ui/**/*.preview.slint file.
slint-interpreter = { workspace = true }
spin_on = { workspace = true }
# examples/screenshots.rs writes the rendered previews as PNG.
png = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
# Version resource of gymdiff.exe (only used when building on Windows).
winresource = "0.1"

[lints]
workspace = true
