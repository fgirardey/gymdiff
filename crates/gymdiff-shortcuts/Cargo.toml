[package]
name = "gymdiff-shortcuts"
description = "GymDiff's Start menu and Desktop shortcuts on Windows (ADR-0012)."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Known folders (Desktop redirection included).
dirs = "6"

[target.'cfg(windows)'.dependencies]
# Writes .lnk files in safe Rust (Windows only: it encodes paths as UTF-16).
mslnk = "0.1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
