[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Florian Girardey"]
publish = false

[workspace.dependencies]
# Internal crates
gymdiff-core = { path = "crates/gymdiff-core" }
gymdiff-lol = { path = "crates/gymdiff-lol" }
gymdiff-diagnostics = { path = "crates/gymdiff-diagnostics" }

# Async runtime & HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
# native-tls (Schannel on Windows, Security.framework on macOS) keeps
# `cargo check --target x86_64-pc-windows-msvc` working from macOS (no C build step).
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# UI
slint = "1"
slint-build = "1"
slint-interpreter = "1"
spin_on = "0.1"
png = "0.18"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
