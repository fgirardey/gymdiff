name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Lint commit messages
        uses: actions/github-script@v9
        with:
          script: |
            const { default: lintCommits } = await import('${{ github.workspace }}/.github/scripts/lint-commits.mjs')
            await lintCommits({ github, context, core })

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  # Lint and tests on both platforms; the release builds are in build.yml.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Release builds (channel `preview`), with their debug files uploaded to Sentry.
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      channel: preview
    secrets: inherit

  # Links the release builds from the pull request, in one comment updated on every push.
  # Not for pull requests from forks: their token cannot comment.
  pr-builds:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Comment the builds on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const { default: commentBuilds } = await import('${{ github.workspace }}/.github/scripts/pr-builds-comment.mjs')
            await commentBuilds({ github, context, core })
