name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Lint commit messages
        uses: actions/github-script@v9
        with:
          script: |
            const { default: lintCommits } = await import('${{ github.workspace }}/.github/scripts/lint-commits.mjs')
            await lintCommits({ github, context, core })

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p gymdiff-app
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gymdiff-windows-${{ github.sha }}
          path: target/release/gymdiff.exe
          retention-days: 14

      - name: Release build (macOS)
        if: runner.os == 'macOS'
        # Tarred so the binary keeps its executable bit inside the artifact zip.
        run: |
          cargo build --release -p gymdiff-app
          tar -czf gymdiff-macos.tar.gz -C target/release gymdiff
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gymdiff-macos-${{ github.sha }}
          path: gymdiff-macos.tar.gz
          retention-days: 14
