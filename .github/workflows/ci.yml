name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Commit the builds are named after: the branch head on a pull request
  # (github.sha is then a temporary merge commit), the pushed commit otherwise.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Lint commit messages
        uses: actions/github-script@v9
        with:
          script: |
            const { default: lintCommits } = await import('${{ github.workspace }}/.github/scripts/lint-commits.mjs')
            await lintCommits({ github, context, core })

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p gymdiff-app -p gymdiff-recorder
        env:
          GYMDIFF_SENTRY_DSN: ${{ vars.GYMDIFF_SENTRY_DSN }}
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gymdiff-windows-${{ env.BUILD_SHA }}
          path: target/release/gymdiff.exe
          retention-days: 14
      - name: Upload Windows recorder
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gymdiff-recorder-windows-${{ env.BUILD_SHA }}
          path: target/release/gymdiff-recorder.exe
          retention-days: 14

      - name: Release build (macOS)
        if: runner.os == 'macOS'
        # Tarred so the binary keeps its executable bit inside the artifact zip.
        run: |
          cargo build --release -p gymdiff-app
          tar -czf gymdiff-macos.tar.gz -C target/release gymdiff
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gymdiff-macos-${{ env.BUILD_SHA }}
          path: gymdiff-macos.tar.gz
          retention-days: 14

  # Links the release builds from the pull request, in one comment updated on every push.
  pr-builds:
    if: always() && github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Comment the builds on the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const { default: commentBuilds } = await import('${{ github.workspace }}/.github/scripts/pr-builds-comment.mjs')
            await commentBuilds({ github, context, core })
