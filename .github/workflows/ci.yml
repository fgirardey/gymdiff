name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Lint commit messages
        uses: actions/github-script@v9
        with:
          script: |
            const { default: lintCommits } = await import('${{ github.workspace }}/.github/scripts/lint-commits.mjs')
            await lintCommits({ github, context, core })

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  # Lint and tests on both platforms: the required checks of a pull request.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Release builds of main: the alpha channel (ADR-0011), with their debug files uploaded to
  # Sentry. Pull requests get builds on demand, with the `build` label (pr-build.yml).
  build:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      channel: alpha
    secrets: inherit

  # Packages the Windows build of main with Velopack and publishes it as its own pre-release,
  # v<version>-alpha.<build>: installer, update packages and the alpha feed, where installed alpha
  # builds look for updates (ADR-0011, docs/Workflow/Releasing.md). Keeps the last 10.
  publish-alpha:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PACK_VERSION: ${{ needs.build.outputs.version }}-alpha.${{ needs.build.outputs.build }}
      REPO_URL: https://github.com/${{ github.repository }}
      VPK_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts
            design/brand
      - uses: actions/download-artifact@v5
        with:
          name: gymdiff-windows-${{ github.sha }}
          path: dist
      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.161
      # The previous alpha package lets vpk build a delta; none before the first Velopack alpha.
      - name: Download the previous alpha
        continue-on-error: true
        run: vpk download github --repoUrl $env:REPO_URL --channel alpha --pre --outputDir releases
      - name: Package
        run: vpk pack --packId GymDiff --packVersion $env:PACK_VERSION --packDir dist --mainExe gymdiff.exe --packTitle GymDiff --packAuthors "Florian Girardey" --icon design/brand/gymdiff.ico --shortcuts "Desktop,StartMenuRoot" --channel alpha --outputDir releases
      - name: Publish
        run: vpk upload github --repoUrl $env:REPO_URL --channel alpha --outputDir releases --publish --pre --releaseName "v$env:PACK_VERSION" --tag "v$env:PACK_VERSION" --targetCommitish ${{ github.sha }}
      - name: Keep the last 10 alpha releases
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const script = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/prune-alphas.mjs`)
            const { default: pruneAlphas } = await import(script.href)
            await pruneAlphas({ github, context, core })
