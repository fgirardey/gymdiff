name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Lint commit messages
        uses: actions/github-script@v9
        with:
          script: |
            const { default: lintCommits } = await import('${{ github.workspace }}/.github/scripts/lint-commits.mjs')
            await lintCommits({ github, context, core })

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  # Lint and tests on both platforms: the required checks of a pull request.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Release builds of main (channel `preview`), with their debug files uploaded to Sentry.
  # Pull requests get them on demand, with the `build` label (pr-build.yml).
  build:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      channel: preview
    secrets: inherit
