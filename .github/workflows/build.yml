name: Build

# Release builds of cooldown.lol for Windows and macOS, called by ci.yml (channel `alpha`, main),
# pr-build.yml (channel `preview`) and release.yml (channel `release`). Uploads the debug files
# and sources to Sentry so its stack traces are symbolicated (see docs/Workflow/Releasing.md
# and ADR-0008). With `velopack-channel`, the Windows job also packages its build with Velopack
# and builds the installer around it (ADR-0011, ADR-0012), for the caller to publish.

on:
  workflow_call:
    inputs:
      channel:
        description: "`alpha` (main), `preview` (pull requests labelled `build`) or `release` (tagged release)."
        type: string
        required: true
      velopack-channel:
        description: "Velopack channel to package the Windows build for: `alpha` or `stable`. Empty: no package."
        type: string
        default: ""
    outputs:
      version:
        description: SemVer of the build, e.g. 0.2.0.
        value: ${{ jobs.build.outputs.version }}
      build:
        description: Build number, e.g. 57.
        value: ${{ jobs.build.outputs.build }}
      sentry-release:
        description: Sentry release of the build, e.g. cooldown@0.2.0+57.
        value: ${{ jobs.build.outputs.sentry-release }}

env:
  CARGO_TERM_COLOR: always
  # Commit the builds are named after: the branch head on a pull request
  # (github.sha is then a temporary merge commit), the pushed commit otherwise.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.sentry.outputs.version }}
      build: ${{ steps.sentry.outputs.build }}
      sentry-release: ${{ steps.sentry.outputs.sentry-release }}
    env:
      COOLDOWN_CHANNEL: ${{ inputs.channel }}
      COOLDOWN_SENTRY_DSN: ${{ vars.COOLDOWN_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      WINDOWS_PACKAGES: -p cooldown-app ${{ inputs.velopack-channel && '-p cooldown-installer' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number counts the commits; set-commits reads the history.
          fetch-depth: 0
          ref: ${{ env.BUILD_SHA }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # The installer is built with the app when it is packaged below: one set of packages, so
      # one build of Slint for both.
      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release ${{ env.WINDOWS_PACKAGES }}
      - name: Release build (macOS)
        if: runner.os == 'macOS'
        # Tarred so the binary keeps its executable bit inside the artifact zip.
        run: |
          cargo build --release -p cooldown-app
          tar -czf cooldown-macos.tar.gz -C target/release cooldown

      - name: Upload debug files to Sentry
        id: sentry
        uses: actions/github-script@v9
        with:
          # A file:// URL: on Windows, import() rejects a bare `D:\…` path.
          script: |
            const { pathToFileURL } = require('node:url')
            const script = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sentry-upload.mjs`)
            const { default: sentryUpload } = await import(script.href)
            const windows = process.platform === 'win32'
            await sentryUpload({ core, exec }, {
              binary: windows ? 'target/release/cooldown.exe' : 'target/release/cooldown',
              debugFiles: windows
                ? ['target/release/cooldown.exe', 'target/release/cooldown.pdb']
                : ['target/release/cooldown', 'target/release/cooldown.dSYM'],
              createRelease: windows,
            })

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cooldown-windows-${{ env.BUILD_SHA }}
          path: target/release/cooldown.exe
          retention-days: 14
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: cooldown-macos-${{ env.BUILD_SHA }}
          path: cooldown-macos.tar.gz
          retention-days: 14

      # Velopack package of the Windows build (ADR-0011): installer, update packages and the feed
      # of the channel, uploaded as one artifact that the caller publishes with `vpk upload`. Done
      # here, where the dependencies of the installer are already compiled.
      - name: Install vpk
        if: runner.os == 'Windows' && inputs.velopack-channel
        run: dotnet tool install --global vpk --version 1.2.161
      # The previous package of the channel lets vpk build a delta; none before the first one.
      - name: Download the previous package
        if: runner.os == 'Windows' && inputs.velopack-channel
        continue-on-error: true
        env:
          VPK_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --channel ${{ inputs.velopack-channel }} ${{ inputs.velopack-channel == 'alpha' && '--pre' || '' }} --outputDir releases
      - name: Package
        if: runner.os == 'Windows' && inputs.velopack-channel
        env:
          # Alpha packages are v<version>-alpha.<build>, stable ones v<version>.
          PACK_VERSION: ${{ steps.sentry.outputs.version }}${{ inputs.velopack-channel == 'alpha' && format('-alpha.{0}', steps.sentry.outputs.build) || '' }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cooldown.exe dist/
          vpk pack --packId cooldown.lol --packVersion $env:PACK_VERSION --packDir dist --mainExe cooldown.exe --packTitle cooldown.lol --packAuthors "Florian Girardey" --icon design/brand/cooldown.ico --shortcuts None --noPortable --channel ${{ inputs.velopack-channel }} --outputDir releases
      # Our installer window (ADR-0012) embeds Velopack's setup and takes its name, so the
      # release offers one cooldown.lol-<channel>-Setup.exe that asks for the shortcuts. The same
      # packages as the release build: only the installer is compiled again.
      - name: Build the installer
        if: runner.os == 'Windows' && inputs.velopack-channel
        env:
          COOLDOWN_VELOPACK_SETUP: ${{ github.workspace }}/releases/cooldown.lol-${{ inputs.velopack-channel }}-Setup.exe
          COOLDOWN_INSTALLER_VERSION: ${{ steps.sentry.outputs.version }}${{ inputs.velopack-channel == 'alpha' && format(' (build {0})', steps.sentry.outputs.build) || '' }}
        run: cargo build --release ${{ env.WINDOWS_PACKAGES }}
      - name: Swap in the installer
        if: runner.os == 'Windows' && inputs.velopack-channel
        run: Copy-Item target/release/cooldown-installer.exe releases/cooldown.lol-${{ inputs.velopack-channel }}-Setup.exe -Force
      - name: Upload the Velopack package
        if: runner.os == 'Windows' && inputs.velopack-channel
        uses: actions/upload-artifact@v4
        with:
          name: cooldown-velopack-${{ env.BUILD_SHA }}
          path: releases
          retention-days: 14

