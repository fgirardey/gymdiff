name: Release

# release-please keeps a `chore: release x.y.z` pull request up to date from the Conventional
# Commits on main. Merging it tags the commit and creates the GitHub Release; this workflow then
# builds that commit (channel `release`), attaches the builds and finalizes the Sentry release.
# See docs/Workflow/Releasing.md and ADR-0008.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A personal token, so CI runs on the release pull request (GitHub does not start
          # workflows for pull requests opened with GITHUB_TOKEN).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      channel: release
    secrets: inherit

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Attach the builds and finalize the Sentry release
        uses: actions/github-script@v9
        with:
          script: |
            const { default: publishRelease } = await import('${{ github.workspace }}/.github/scripts/publish-release.mjs')
            await publishRelease({ github, context, core, exec }, {
              tag: '${{ needs.release-please.outputs.tag }}',
              version: '${{ needs.build.outputs.version }}',
              sentryRelease: '${{ needs.build.outputs.sentry-release }}',
              dist: 'dist',
            })

  # Windows installer and update packages of the release (Velopack, channel `stable`), merged into
  # the release created by release-please (ADR-0011).
  package-windows:
    needs: [release-please, build]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PACK_VERSION: ${{ needs.build.outputs.version }}
      REPO_URL: https://github.com/${{ github.repository }}
      VPK_TOKEN: ${{ github.token }}
    steps:
      # The whole repository: the installer is built here, around the package.
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - uses: actions/download-artifact@v5
        with:
          name: gymdiff-windows-${{ github.sha }}
          path: dist
      - name: Install vpk
        run: dotnet tool install --global vpk --version 1.2.161
      # The previous stable package lets vpk build a delta; none before the first release.
      - name: Download the previous release
        continue-on-error: true
        run: vpk download github --repoUrl $env:REPO_URL --channel stable --outputDir releases
      - name: Package
        run: vpk pack --packId GymDiff --packVersion $env:PACK_VERSION --packDir dist --mainExe gymdiff.exe --packTitle GymDiff --packAuthors "Florian Girardey" --icon design/brand/gymdiff.ico --shortcuts None --channel stable --outputDir releases
      # Our installer window (ADR-0012) embeds Velopack's setup and takes its name, so the
      # release offers one GymDiff-stable-Setup.exe that asks for the shortcuts.
      - name: Build the installer
        env:
          GYMDIFF_VELOPACK_SETUP: ${{ github.workspace }}/releases/GymDiff-stable-Setup.exe
          GYMDIFF_INSTALLER_VERSION: ${{ needs.build.outputs.version }}
        run: cargo build --release -p gymdiff-installer
      - name: Swap in the installer
        run: Copy-Item target/release/gymdiff-installer.exe releases/GymDiff-stable-Setup.exe -Force
      - name: Add to the release
        run: vpk upload github --repoUrl $env:REPO_URL --channel stable --outputDir releases --merge --publish --releaseName "${{ needs.release-please.outputs.tag }}" --tag "${{ needs.release-please.outputs.tag }}"
